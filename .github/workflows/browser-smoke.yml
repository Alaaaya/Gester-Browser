name: Browser runtime regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise isolated read-only Files tab
        run: tests/browser_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/browser-smoke/
